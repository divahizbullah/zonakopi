const brandH=()=>{const U=(typeof S!=="undefined"&&S&&S.ui)||{};return`<span class="brand"><img class="lg" src="${U.logo||LOGO}" alt="${esc(U.name||"ZONA")}"><span><b>${esc(U.name||"ZONA")}</b><small>${esc(U.tag!=null?U.tag:"Tentukan Zona Mu")}</small></span></span>`};
const KEY="zona_mgmt_v1",$=s=>document.querySelector(s),V=id=>$("#"+id).value;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rp=n=>"Rp"+Math.round(n).toLocaleString("id-ID");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const jk=d=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Jakarta"}).format(d?new Date(d):new Date());
const dt=iso=>new Date(iso).toLocaleString("id-ID",{timeZone:"Asia/Jakarta"});
/* ===== HARI BUKA (jam potong per cabang) ===== */
const cutH=b=>{const c=S.branches.find(x=>x.id==b);return c&&c.cut!=null&&Number.isFinite(+c.cut)?+c.cut:5};
const bdOf=(at,b)=>jk(new Date(new Date(at).getTime()-cutH(b)*36e5));
const bd=s=>s.day||jk(s.at);
const simple=()=>!authed||(!!cur&&cur.role=="kasir"&&ACC.kasir.length<2);
const allB=()=>!!rf.all&&!brLock(cur);
const brLock=u=>!!u&&(u.role=="kepala"||u.role=="kasir"||u.role=="customer");
const tdy=b=>bdOf(Date.now(),b||br);
/* ===== MODE EVENT (harga jual khusus) ===== */
const evOn=()=>{const e=S.event;return !!(e&&e.modes&&e.modes[br])};
const pR=p=>{if(evOn()){const e=(S.event.prices||{})[p.id];if(e&&Number.isFinite(e.p))return e.p}return p.price};
const pL=p=>{if(evOn()){const e=(S.event.prices||{})[p.id];if(e&&Number.isFinite(e.L))return e.L}return p.priceL};
/* ===== BUKA / TUTUP TOKO ===== */
const modeOf=b=>{const c=S.branches.find(x=>x.id==b);return c&&(c.mode=="auto"||c.mode=="manual")?c.mode:"off"};
