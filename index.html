.dl{flex:1;min-width:160px;display:grid;gap:5px;font-size:.85rem}.dl div{display:flex;align-items:center;gap:6px}.dl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dl b{white-space:nowrap}.dl em{opacity:.6;font-style:normal;font-size:.78rem;width:44px;text-align:right}
.hbw{display:grid;gap:7px}.hbr{display:grid;grid-template-columns:minmax(70px,32%) 1fr auto;gap:8px;align-items:center;font-size:.83rem}.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ht{display:grid;gap:2px}.ht i{display:block;height:9px;border-radius:5px;min-width:2px}.ht i.b2{height:6px}.hv{font-weight:700;white-space:nowrap;text-align:right}
@media print{.chc{break-inside:avoid}.ht i,.lgd i,.dl i,.chw svg *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.stt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stt .card{padding:10px;min-width:0}.stt .mut{display:block;font-size:.75rem}.stt b{display:block;font-size:1rem;overflow-wrap:anywhere}
.sbar{display:flex;gap:8px;flex-wrap:wrap}.sbar .btn{flex:1 1 140px}
.sl{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin-bottom:12px}
.si{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 8px rgba(11,58,117,.12);min-width:0}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.sh b{overflow-wrap:anywhere}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-bottom:10px}.sg div{min-width:0}.sg .mut{display:block;font-size:.75rem}.sg b{font-size:.92rem;overflow-wrap:anywhere}
.sa{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}.sa .btn{padding:8px 4px;font-size:.85rem}
.sa2{display:flex;gap:8px;margin-top:4px}.sa2 .btn{flex:1}
.btn.dn{background:#fde8e8;color:#b42318}.btn.dn:hover{background:#b42318;color:#fff}
details.card summary{cursor:pointer}
.mvr{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--s)}.mvr:last-child{border:0}
.pk{border:1px dashed var(--s);border-radius:8px;padding:8px}.pk summary{cursor:pointer;font-size:.82rem;font-weight:600}.pkg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.rbw{display:flex;flex-direction:column;gap:8px;background:var(--c);border-radius:10px;padding:10px}
.rbr{background:#fff;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.rbq{display:flex;gap:6px;align-items:center}.rbq input{flex:1;min-width:0}.rbu{min-width:34px;font-weight:600}.rbs{font-size:.8rem}.rct{font-weight:700}
.rcd{margin-top:4px;font-size:.82rem}.rcd summary{cursor:pointer;color:var(--m);font-weight:600}.rcl{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:2px 0}.rcl.tot{font-weight:700;border-top:1px dashed var(--s);margin-top:2px}

(lc.sales||[]).forEach(x=>{const o=sid.get(x.id);

else if(x.st=="VOID"&&o.st=="OK"){o.st="VOID";o.voidAt=x.voidAt;use(o,1);nv++}});

function ESC(){const a=[],o={

bytes(b){for(let i=0;i<b.length;i++)a.push(b[i]);return o},

al(n){return o.raw(0x1b,0x61,n)},
b(on){return o.raw(0x1b,0x45,on?1:0)},
sz(w,h){return o.raw(0x1d,0x21,((w-1)<<4)|(h-1))},
tx(s){return o.bytes(ENCT.encode(asc(s)))},
