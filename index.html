function mergeInto(sv,lc){let ns=0,ne=0,nb=0,nv=0;sv.seq=sv.seq||{};sv.stock=sv.stock||{};sv.sales=sv.sales||[];sv.exp=sv.exp||[];sv.buys=sv.buys||[];sv.mv=sv.mv||[];
if(!confirm("Data di server sudah berubah, dan perangkat ini punya data baru yang belum terkirim.\n\nGabungkan? Transaksi, pengeluaran, dan pembelian perangkat ini akan ditambahkan ke data server. Perubahan lain di perangkat ini (mis. edit produk atau pengaturan) akan diganti data server."))throw new Error("Dibatalkan");
const use=(x,g)=>x.items.forEach(i=>(i.u||((lc.products.find(p=>p.id==i.pid)||{}).recipe||[]).map(r=>({i:r.i,q:r.q}))).forEach(r=>{const k=x.br+"|"+r.i;sv.stock[k]=(sv.stock[k]||0)+g*r.q*i.qty}));
Object.keys(lc.seq||{}).forEach(k=>sv.seq[k]=Math.max(sv.seq[k]||0,lc.seq[k]));
const sid=new Map(sv.sales.map(x=>[x.id,x])),nos=new Set(sv.sales.map(x=>x.no));
(lc.sales||[]).forEach(x=>{const o=sid.get(x.id);
if(!o){if(nos.has(x.no)){const d=jk(x.at).replaceAll("-",""),k=x.br+d;sv.seq[k]=(sv.seq[k]||0)+1;x.no=`ZC-${x.br.toUpperCase()}-${d}-${String(sv.seq[k]).padStart(4,"0")}`}
nos.add(x.no);if(x.st=="OK")use(x,-1);sv.sales.push(x);ns++}
else if(x.st=="VOID"&&o.st=="OK"){o.st="VOID";o.voidAt=x.voidAt;use(o,1);nv++}});
const eid=new Map(sv.exp.map(e=>[e.id,e]));(lc.exp||[]).forEach(e=>{const o=eid.get(e.id);if(!o){sv.exp.push(e);ne++}else if(e.st=="VOID"&&o.st=="OK"){o.st="VOID";nv++}});
const bk=b=>[b.at,b.br,b.i,b.n,b.t].join("|"),bs=new Set(sv.buys.map(bk));(lc.buys||[]).forEach(b=>{if(!bs.has(bk(b))){sv.buys.push(b);const k=b.br+"|"+b.i;sv.stock[k]=(sv.stock[k]||0)+b.n;nb++}});
const mk=m=>[m.at,m.br,m.i,m.d,m.why].join("|"),ms=new Set(sv.mv.map(mk));(lc.mv||[]).forEach(m=>{if(!ms.has(mk(m))&&/^(Penjualan|Pembatalan|Penerimaan)/.test(m.why))sv.mv.push(m)});
sv.mv.sort((a,b)=>a.at<b.at?-1:a.at>b.at?1:0);
return`${ns} transaksi, ${ne} pengeluaran, ${nb} pembelian, ${nv} pembatalan`}

c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
const url=c.toDataURL("image/jpeg",.92),data=url.split(",")[1],pv=$("#qri");pv.src=url;pv.style.display="block";
const r=await fetch(DRIVE_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:DRIVE_TOKEN,name:"qris-"+Date.now()+".jpg",mime:"image/jpeg",data})});
const j=await r.json();if(!j.ok)throw new Error(j.error||"Gagal");
S.pay.qris=j.id;save();$("#qrd").style.display="inline-block";st.textContent="QRIS tersimpan di Google Drive ✓"}
catch(e){console.error(e);st.textContent="Gagal unggah: "+e.message}
finally{el.disabled=false;URL.revokeObjectURL(u)}};img.src=u}

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAnalytics,isSupported}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
import{getFirestore,collection,doc,onSnapshot,writeBatch,getDocsFromServer}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBOjKUzM39tYdHfBVnZ8aNN6n5I4nAQ8P8",authDomain:"zona-c04ee.firebaseapp.com",projectId:"zona-c04ee",storageBucket:"zona-c04ee.firebasestorage.app",messagingSenderId:"862629272585",appId:"1:862629272585:web:1c82c88eadf732a3de2cd8",measurementId:"G-REQRPPQ03Q"};
const app=initializeApp(firebaseConfig);
isSupported().then(ok=>{if(ok)getAnalytics(app)}).catch(()=>{});
const db=getFirestore(app),col=collection(db,"zona_mgmt"),CID=uid(),CH=300000;
let ready=false,timer=null,lastJson="",nOld=0,retry=null;
const bd=document.createElement("div");bd.className="np";
bd.style.cssText="position:fixed;top:6px;right:8px;z-index:30;font:11px system-ui;padding:3px 9px;border-radius:99px;background:#fff;color:#0b3a75;box-shadow:0 1px 6px rgba(11,58,117,.25);pointer-events:none";
document.body.appendChild(bd);
const st=(t,bad)=>{bd.textContent=t;bd.style.color=bad?"#b42318":"#0b3a75"};
st("☁ Menyambung…");
const busy=()=>$("#modal").classList.contains("on")||/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||"");
function safeRender(){clearTimeout(retry);if(busy())retry=setTimeout(safeRender,1500);else render()}
async function push(){
  const json=JSON.stringify(S);if(json===lastJson){window.dirtyL=false;st("☁ Tersinkron");return}
  const parts=[];for(let i=0;i<json.length;i+=CH)parts.push(json.slice(i,i+CH));
  const v=Date.now(),b=writeBatch(db);
  parts.forEach((d,i)=>b.set(doc(col,"c"+String(i).padStart(4,"0")),{i,n:parts.length,v,by:CID,d}));
  for(let i=parts.length;i<nOld;i++)b.delete(doc(col,"c"+String(i).padStart(4,"0")));
  lastJson=json;nOld=parts.length;window.dirtyL=false;st("☁ Menyimpan…");
  try{await b.commit();st("☁ Tersinkron")}catch(e){console.error(e);lastJson="";window.dirtyL=true;st("☁ Gagal simpan",1)}
}
window.cloudPush=()=>{if(!ready)return;clearTimeout(timer);timer=setTimeout(push,700)};
function adopt(o,json,n){lastJson=json;nOld=n;S=o;S.promos=S.promos||[];S.users=S.users||[];fixS();localStorage.setItem(KEY,JSON.stringify(S));
  if(!S.branches.some(x=>x.id==br))br=S.branches[0].id;
  if(authed){cur=S.users.find(u=>u.id==cur.id)||null;if(!cur){lock();return}if(cur.role=="kepala")br=cur.br}}
window.cloudSync=async(mergeFn)=>{
  if(!ready)throw new Error("Belum tersambung ke server");
  const snap=await getDocsFromServer(col),ds=snap.docs.map(x=>x.data()).sort((a,b)=>a.i-b.i);
  if(ds.length&&(ds.length!==ds[0].n||ds.some(x=>x.v!==ds[0].v)))throw new Error("Server sedang menyimpan dari perangkat lain, coba lagi sebentar");
  const sj=ds.map(x=>x.d).join(""),dirty=!!window.dirtyL;clearTimeout(timer);
  if(!sj||sj===lastJson){if(dirty){await push();return{k:"sent"}}return{k:"same"}}
  if(!dirty){adopt(JSON.parse(sj),sj,ds.length);return{k:"pulled"}}
  const sv=JSON.parse(sj),msg=mergeFn(sv,S);adopt(sv,sj,ds.length);await push();return{k:"merged",msg}};
onSnapshot(col,snap=>{
  if(snap.metadata.hasPendingWrites)return;
  const ds=snap.docs.map(x=>x.data()).sort((a,b)=>a.i-b.i);
  if(!ds.length){if(!ready){ready=true;push()}return}
  if(ds.length!==ds[0].n||ds.some(x=>x.v!==ds[0].v))return;
  nOld=ds.length;
  if(ready&&ds[0].by===CID){st("☁ Tersinkron");return}
  const json=ds.map(x=>x.d).join("");
  if(json===lastJson){ready=true;st("☁ Tersinkron");return}
  try{
    const d=JSON.parse(json),loc=localStorage.getItem(KEY);
    if(!ready&&loc&&loc!==json&&!localStorage.getItem(KEY+"_localbackup"))localStorage.setItem(KEY+"_localbackup",loc);
    lastJson=json;S=d;S.promos=S.promos||[];S.users=S.users||[];fixS();localStorage.setItem(KEY,json);
    if(!S.branches.some(x=>x.id==br))br=S.branches[0].id;
    if(authed){cur=S.users.find(u=>u.id==cur.id)||null;if(!cur){lock();ready=true;st("☁ Tersinkron");return}if(cur.role=="kepala")br=cur.br}
    ready=true;st("☁ Tersinkron");safeRender();
  }catch(e){console.error(e);st("☁ Data cloud rusak",1)}
},e=>{console.error(e);st(e.code=="permission-denied"?"☁ Izin ditolak (cek Rules)":"☁ Offline",1)});
addEventListener("online",()=>st("☁ Menyambung…"));
</script>
