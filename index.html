const brandH=()=>`<span class="brand"><img class="lg" src="${LOGO}" alt="ZONA"><span><b>ZONA</b><small>Tentukan Zona Mu</small></span></span>`;
const KEY="zona_mgmt_v1",$=s=>document.querySelector(s),V=id=>$("#"+id).value;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rp=n=>"Rp"+Math.round(n).toLocaleString("id-ID");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const jk=d=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Jakarta"}).format(d?new Date(d):new Date());
const dt=iso=>new Date(iso).toLocaleString("id-ID",{timeZone:"Asia/Jakarta"});
/* ===== HARI BUKA (jam potong per cabang) ===== */
const cutH=b=>{const c=S.branches.find(x=>x.id==b);return c&&c.cut!=null&&Number.isFinite(+c.cut)?+c.cut:5};
const bdOf=(at,b)=>jk(new Date(new Date(at).getTime()-cutH(b)*36e5));
const bd=s=>s.day||jk(s.at);
const simple=()=>!authed||(!!cur&&cur.role=="kasir"&&ACC.kasir.length<2);
const allB=()=>!!rf.all&&!brLock(cur);
const brLock=u=>!!u&&(u.role=="kepala"||u.role=="kasir");
const tdy=b=>bdOf(Date.now(),b||br);
/* ===== MODE EVENT (harga jual khusus) ===== */
const evOn=()=>{const e=S.event;return !!(e&&e.modes&&e.modes[br])};
const pR=p=>{if(evOn()){const e=(S.event.prices||{})[p.id];if(e&&Number.isFinite(e.p))return e.p}return p.price};
const pL=p=>{if(evOn()){const e=(S.event.prices||{})[p.id];if(e&&Number.isFinite(e.L))return e.L}return p.priceL};
/* ===== BUKA / TUTUP TOKO ===== */
const modeOf=b=>{const c=S.branches.find(x=>x.id==b);return c&&(c.mode=="auto"||c.mode=="manual")?c.mode:"off"};
const shopOn=b=>modeOf(b)!="off";

return`<div class="card" style="margin-bottom:12px"><b>Hak akses per peran</b><p class="mut" style="margin:6px 0">Centang menu yang boleh dibuka tiap peran, lalu simpan. Layar Kasir selalu ada untuk semua peran, Owner selalu punya Pengguna dan Pengaturan, dan menu Pengguna tidak bisa diberikan ke Kepala outlet maupun Kasir. Kepala outlet dan Kasir hanya melihat data cabangnya sendiri. Perubahan berlaku saat halaman di perangkat mereka diperbarui atau dibuka ulang.</p><div class="tw"><table><tr><th>Menu</th>${R.map(r=>`<th style="text-align:center">${r[1]}</th>`).join("")}</tr>${ALL.map(v=>`<tr><td>${VLBL[v]}</td>${R.map(r=>{const lim=r[0]=="kepala"||r[0]=="kasir",fixed=v=="kasir"||(r[0]=="owner"&&(v=="pengguna"||v=="set"||v=="printer"||v=="struk"))||(lim&&v=="pengguna");return`<td style="text-align:center"><input type="checkbox" data-acc="${r[0]}|${v}" ${(ACC[r[0]]||[]).includes(v)?"checked":""} ${fixed?"disabled":""}></td>`}).join("")}</tr>`).join("")}</table></div><div class="fm" style="margin-top:8px"><button class="btn" onclick="accSave()">Simpan hak akses</button><button class="btn s" onclick="accReset()">Kembalikan default</button></div></div>`}
function accSave(){if(cur.role!="owner")return;const A={owner:[],manager:[],kepala:[],kasir:[],v:2};document.querySelectorAll("[data-acc]").forEach(c=>{if(c.checked){const[r,v]=c.dataset.acc.split("|");A[r].push(v)}});S.acc=A;applyAcc();logA("atur-akses","peran",["owner","manager","kepala","kasir"].map(r=>r+":"+ACC[r].length).join(" "));save();toast("Hak akses disimpan");render()}
function accReset(){if(cur.role!="owner"||!confirm("Kembalikan hak akses semua peran ke pengaturan awal?"))return;delete S.acc;applyAcc();logA("atur-akses","peran","default");save();render()}
function vUser(){const own=cur.role=="owner";return`${accCard()}<div class="card fm"><input id="u1" placeholder="Username" autocapitalize="none"><input id="u2" placeholder="Nama">${pwf("u3","Password (min 6)","new-password")}<select id="u4"><option value="kasir">Kasir (hanya checkout)</option><option value="kepala">Kepala outlet</option><option value="manager">Manager</option>${own?'<option value="owner">Owner</option>':""}</select><select id="u5">${opt(S.branches,b=>`<option value="${b.id}">${esc(b.name)}</option>`)}</select><button class="btn" onclick="uadd()">Tambah</button></div>
<p class="mut">Cabang dipakai untuk Kasir dan Kepala outlet. Owner & Manager: akses semua menu. Kepala outlet: hanya tambah produk baru, buat promo, dan input pengeluaran harian cabangnya.</p>
<div class="tw"><table><tr><th>Username</th><th>Nama</th><th>Peran</th><th>Cabang</th><th></th></tr>${opt(S.users,u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.name)}</td><td>${ROLEN[u.role]}</td><td>${brLock(u)?esc(bn(u.br)):"Semua"}</td><td>${u.role=="owner"&&!own?"":`<button class="btn s" onclick="uedit('${u.id}')">Edit</button> <button class="btn s" onclick="upw('${u.id}')">Reset password</button> ${u.id!=cur.id?`<button class="btn r" onclick="udel('${u.id}')">Hapus</button>`:""}`}</td></tr>`)}</table></div>`}
async function uadd(){const un=V("u1").trim().toLowerCase(),pw=V("u3"),role=V("u4");if(!/^[a-z0-9._-]{3,20}$/.test(un))return alert("Username 3-20 karakter (huruf kecil, angka, . _ -)");if(S.users.some(x=>x.username==un))return alert("Username sudah dipakai");if(pw.length<6)return alert("Password minimal 6 karakter");if(role=="owner"&&cur.role!="owner")return;const salt=uid()+uid();S.users.push({id:uid(),username:un,name:V("u2").trim()||un,role,br:(role=="kepala"||role=="kasir")?V("u5"):"",salt,h:await hash(pw,salt)});save();render()}
function uedit(id){const u=S.users.find(x=>x.id==id);if(!u||(u.role=="owner"&&cur.role!="owner"))return;const self=u.id==cur.id;
modal(`<h3>Edit pengguna</h3><div class="fm" style="flex-direction:column;align-items:stretch;gap:8px;margin-top:8px"><label class="mut">Username<input id="eu1" value="${esc(u.username)}" autocapitalize="none" style="width:100%"></label><label class="mut">Nama<input id="eu2" value="${esc(u.name||"")}" style="width:100%"></label><label class="mut">Peran${self?" (tidak bisa mengubah peran akun sendiri)":""}<select id="eu4" style="width:100%" ${self?"disabled":""}>${[["kasir","Kasir (hanya checkout)"],["kepala","Kepala outlet"],["manager","Manager"],...(cur.role=="owner"?[["owner","Owner"]]:[])].map(r=>`<option value="${r[0]}" ${u.role==r[0]?"selected":""}>${r[1]}</option>`).join("")}</select></label><label class="mut">Cabang (untuk Kasir &amp; Kepala outlet)<select id="eu5" style="width:100%">${opt(S.branches,b=>`<option value="${b.id}" ${u.br==b.id?"selected":""}>${esc(b.name)}</option>`)}</select></label>${pwf("eu3","Password baru (kosongkan jika tidak diubah)","new-password")}<div><button class="btn" onclick="usave('${u.id}')">Simpan</button> <button class="btn s" onclick="closeM()">Batal</button></div></div>`)}
async function usave(id){const u=S.users.find(x=>x.id==id);if(!u||(u.role=="owner"&&cur.role!="owner"))return;const un=V("eu1").trim().toLowerCase(),role=u.id==cur.id?u.role:V("eu4"),pw=V("eu3");
if(!/^[a-z0-9._-]{3,20}$/.test(un))return alert("Username 3-20 karakter (huruf kecil, angka, . _ -)");if(S.users.some(x=>x.id!=id&&x.username==un))return alert("Username sudah dipakai");
if(role=="owner"&&cur.role!="owner")return;if(u.role=="owner"&&role!="owner"&&S.users.filter(x=>x.role=="owner").length<2)return alert("Tidak bisa mengubah peran owner terakhir");
if(pw&&pw.length<6)return alert("Password minimal 6 karakter");
const old=u.username+"/"+u.role+"/"+(u.br||"-");u.username=un;u.name=V("eu2").trim()||un;u.role=role;u.br=(role=="kepala"||role=="kasir")?V("eu5"):"";
if(pw){u.salt=uid()+uid();u.h=await hash(pw,u.salt)}
logA("edit-pengguna",un,old+" → "+un+"/"+role+"/"+(u.br||"-")+(pw?" +password":""));save();closeM();toast("Data pengguna diperbarui");render()}
async function upw(id){const u=S.users.find(x=>x.id==id),p=prompt("Password baru untuk "+u.username+" (min 6 karakter)");if(!p)return;if(p.length<6)return alert("Minimal 6 karakter");u.salt=uid()+uid();u.h=await hash(p,u.salt);save();alert("Password diubah")}
function udel(id){const u=S.users.find(x=>x.id==id);if(u.role=="owner"&&S.users.filter(x=>x.role=="owner").length<2)return alert("Tidak bisa menghapus owner terakhir");if(confirm("Hapus pengguna "+u.username+"?")){S.users=S.users.filter(x=>x.id!=id);save();render()}}
/* ===== PROMO ===== */
let vcode="";
const promoOk=(p,t)=>{const d=tdy();return p.on&&d>=p.from&&d<=p.to&&(p.br=="all"||p.br==br)&&t>=p.min};
const pdisc=(p,t)=>Math.min(t,p.type=="P"?Math.round(t*p.val/100):p.val);
function best(t){let b=null,v=0;const c=[...S.promos.filter(p=>!p.code),...(vcode?S.promos.filter(p=>p.code&&p.code.toLowerCase()==vcode.toLowerCase()):[])];
c.forEach(p=>{if(promoOk(p,t)){const x=pdisc(p,t);if(x>v){v=x;b=p}}});return{p:b,d:v}}
const dscH=()=>{const b=best(sub());return b.p?`<div class="mut">Promo: ${esc(b.p.name)} <b>−${rp(b.d)}</b></div>`:""};
function vPromo(){const kp=cur.role=="kepala",L=S.promos.filter(p=>!kp||p.br=="all"||p.br==cur.br).slice().reverse();
return`<div class="card fm"><input id="m1" placeholder="Nama promo"><select id="m2"><option value="P">Diskon %</option><option value="N">Diskon Rp</option></select><input id="m3" type="number" placeholder="Nilai" style="width:90px"><input id="m4" type="number" placeholder="Min. belanja" style="width:110px"><input id="m5" placeholder="Kode voucher (kosong = otomatis)" style="width:200px"><label class="mut">Mulai <input id="m6" type="date" value="${jk()}"></label><label class="mut">Selesai <input id="m7" type="date" value="${jk()}"></label>${kp?"":`<select id="m8"><option value="all">Semua cabang</option>${opt(S.branches,b=>`<option value="${b.id}">${esc(b.name)}</option>`)}</select>`}<button class="btn" onclick="madd()">Buat promo</button></div>
<p class="mut">Promo tanpa kode berlaku otomatis di kasir; promo berkode butuh voucher dimasukkan kasir. Tidak digabung: yang dipakai adalah diskon terbesar.${kp?" Promo yang Anda buat berlaku untuk cabang Anda.":""}</p>
<div class="tw"><table><tr><th>Nama</th><th>Diskon</th><th>Min.</th><th>Kode</th><th>Periode</th><th>Cabang</th><th>Status</th><th></th></tr>${opt(L,p=>`<tr><td>${esc(p.name)}</td><td>${p.type=="P"?p.val+"%":rp(p.val)}</td><td>${rp(p.min)}</td><td>${esc(p.code||"otomatis")}</td><td>${p.from} s/d ${p.to}</td><td>${p.br=="all"?"Semua":esc(bn(p.br))}</td><td>${!p.on?"Nonaktif":jk()>p.to?"Berakhir":jk()<p.from?"Terjadwal":"Aktif"}</td><td>${kp?"":`<button class="btn s" onclick="ptog('${p.id}')">${p.on?"Nonaktifkan":"Aktifkan"}</button>`}</td></tr>`)||'<tr><td colspan="8" class="mut">Belum ada promo.</td></tr>'}</table></div>`}
function madd(){const name=V("m1").trim(),type=V("m2"),val=+V("m3"),from=V("m6"),to=V("m7"),code=V("m5").trim();
if(!name||!(val>0)||(type=="P"&&val>100)||!from||!to||from>to)return alert("Lengkapi nama, nilai valid (persen maks 100), dan periode");
if(code&&S.promos.some(p=>p.code&&p.code.toLowerCase()==code.toLowerCase()))return alert("Kode voucher sudah dipakai");
S.promos.push({id:uid(),name,type,val:type=="P"?val:Math.round(val),min:Math.round(+V("m4")||0),code,from,to,br:brLock(cur)?cur.br:V("m8"),on:1,by:cur.username});save();render()}
function ptog(id){const p=S.promos.find(x=>x.id==id);p.on=p.on?0:1;save();render()}
/* ===== KASIR ===== */
const adl=l=>(prod(l.pid).addons||[]).filter(a=>l.ad.includes(a.id));
const szp=l=>l.sz=="L"&&Number.isFinite(prod(l.pid).priceL)?pL(prod(l.pid)):pR(prod(l.pid));
const unit=l=>szp(l)+adl(l).reduce((t,a)=>t+a.price,0);
const lrec=l=>[...prod(l.pid).recipe,...adl(l).flatMap(a=>a.recipe||[])];
const lhpp=l=>lrec(l).reduce((t,r)=>t+r.q*(ing(r.i)?.cost||0),0);
const sub=()=>cart.reduce((s,l)=>s+unit(l)*l.qty,0);
const tot=()=>sub()-best(sub()).d;
const CUP='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5V8z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M9 3v2M13 3v2"/></svg>',
BAG='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>',
SRCH='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
let cat="";
let GC=+localStorage.getItem("zona_gc")||(innerWidth>1100?5:innerWidth>800?4:3);
const gcBtns=()=>[3,4,5,6].map(n=>`<button class="gcb ${GC==n?"on":""}" onclick="setGC(${n})" aria-label="${n} kolom per baris">${n}</button>`).join("");
function setGC(n){GC=n;localStorage.setItem("zona_gc",n);$("#grid").style.setProperty("--gc",n);$("#gcs").innerHTML='<span class="mut">Kolom</span>'+gcBtns()}
const cats=()=>[...new Set(S.products.filter(p=>p.active).map(p=>p.cat))];
const kcol=c=>["#1d5fb4","#c47a2c","#2a9d8f","#7b5ea7","#d1495b","#4c8c2b"][Math.max(0,[...new Set(S.products.map(p=>p.cat))].indexOf(c))%6];
const chips=()=>`<button class="cc ${cat?"":"on"}" onclick="setCat('')">Semua</button>`+cats().map(c=>`<button class="cc ${cat==c?"on":""}" data-c="${esc(c)}" onclick="setCat(this.dataset.c)">${esc(c)}</button>`).join("");
function setCat(c){cat=c;$("#chips").innerHTML=chips();$("#grid").innerHTML=grid()}
const pn=n=>Math.round(n).toLocaleString("id-ID");
const qv=(id,sz)=>cart.filter(l=>l.pid==id&&l.sz==sz).reduce((a,l)=>a+l.qty,0);
function vrow(p,sz){const n=qv(p.id,sz),nm=sz=="L"?"Large":"Reguler";
return`<div class="vr ${sz} ${n?"has":""}"><button class="va" onclick="event.stopPropagation();addC('${p.id}','${sz}')" aria-label="Tambah ${nm} ${esc(p.name)}"><span class="vl">${sz}</span><span>${pn(sz=="L"?pL(p):pR(p))}</span></button>${n?`<div class="stp"><button class="mn" onclick="event.stopPropagation();dec('${p.id}','${sz}')" aria-label="Kurangi ${nm}">−</button><span class="bdg">${n}</span></div>`:""}</div>`}
function grid(){return opt(S.products.filter(p=>p.active&&(!cat||p.cat==cat)&&p.name.toLowerCase().includes(q.toLowerCase())),p=>{const n=cart.filter(l=>l.pid==p.id).reduce((a,l)=>a+l.qty,0);
return`<div class="pt ${n?"sel":""}" style="--k:${kcol(p.cat)}" onclick="addC('${p.id}')"><div class="pim">${p.photo?`<img loading="lazy" src="${phUrl(p.photo,500)}" alt="${esc(p.name)}">`:CUP}</div><div class="pn">${esc(p.name)}</div><div class="pk">${esc(p.cat)}</div><div class="vrs ${Number.isFinite(p.priceL)?"":"one"}">${vrow(p,"R")}${Number.isFinite(p.priceL)?vrow(p,"L"):""}</div></div>`})||'<p class="mut">Tidak ada produk.</p>'}
function lines(){return cart.length?opt(cart,(l,i)=>{const p=prod(l.pid),sz=l.sz=="L"&&Number.isFinite(p.priceL)?"L":"R";
return`<div class="cl"><div class="clt"><div><b><span class="szt ${sz}">${sz}</span>${esc(p.name)}</b><div class="mut sm">${esc([sz=="L"?"Large":"Reguler",...adl(l).map(a=>a.name)].join(", "))}</div></div><b>${rp(unit(l)*l.qty)}</b></div>
<div class="clb"><div class="stp"><button onclick="qty(${i},-1)" aria-label="Kurangi">−</button><span>${l.qty}</span><button onclick="qty(${i},1)" aria-label="Tambah">+</button></div>${opt(p.addons||[],a=>`<label class="ch ${l.ad.includes(a.id)?"on":""}"><input type="checkbox" ${l.ad.includes(a.id)?"checked":""} onchange="tg(${i},'${a.id}')">${l.ad.includes(a.id)?"✓ ":""}${esc(a.name)} +${rp(a.price)}</label>`)}<button class="rm" onclick="qty(${i},-999)" aria-label="Hapus">✕</button></div></div>`}):'<div class="emp"><b>Belum ada pesanan</b><div class="sm">Ketuk R atau L pada produk untuk menambahkannya.</div></div>'}
function vKasir(){if(cat&&!cats().includes(cat))cat="";const n=cart.reduce((a,l)=>a+l.qty,0);
return`<div class="pos"><section>${modeBar()}<div class="srch">${SRCH}<input placeholder="Cari produk" aria-label="Cari produk" value="${esc(q)}" oninput="q=this.value;$('#grid').innerHTML=grid()"></div><div class="chipsr" id="chips">${chips()}</div><div class="gcs" id="gcs"><span class="mut">Kolom</span>${gcBtns()}</div><div class="pg" id="grid" style="--gc:${GC}">${grid()}</div></section>
<aside class="cartp"><div class="cph"><div><b class="cpt">Pesanan</b><span class="mut" id="cn">${n} item</span></div><div><button class="lnk" onclick="clr()">Kosongkan</button><button class="btn s mclose" onclick="cartClose()">Tutup ✕</button></div></div>
<div class="cbody"><div id="cl">${lines()}</div>
<div class="vch"><input id="vc" placeholder="Kode voucher" value="${esc(vcode)}"><button class="btn s" onclick="vcode=V('vc').trim();refC();if(vcode&&!best(sub()).p)alert('Voucher tidak berlaku (kode salah, belum memenuhi syarat, atau promo otomatis lebih besar)')">Pakai</button></div><div id="dsc">${dscH()}</div>
</div>
<div class="cft"><div class="ttr"><span>Total</span><b class="big" id="tt">${rp(tot())}</b></div><button class="pay" id="pb" onclick="payOpen()">Pembayaran · ${rp(tot())}</button></div></aside>
<div class="cbd" onclick="cartClose()"></div>
<div class="mbar ${n?"":"empty"}" role="button" tabindex="0" onclick="cartOpen()" onkeydown="if(event.key=='Enter')cartOpen()"><span class="mbi">${BAG}<i id="mn">${n}</i></span><span class="mbt"><small>Total</small><b id="mt">${rp(tot())}</b></span><span class="mbb">Lihat & Bayar</span></div>`}
const cartOpen=()=>$(".cartp").classList.add("open"),cartClose=()=>$(".cartp").classList.remove("open");
function payHtml(){return`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b style="font-size:1.1rem">Pembayaran</b><button class="btn s" onclick="closeM()">Tutup ✕</button></div><div class="ttr"><span>Total</span><b class="big">${rp(tot())}</b></div><div class="seg s4">${[["CASH","Tunai"],["QRIS","QRIS"],["TRANSFER","Transfer"],["SPLIT","Campur"]].map(x=>`<button class="${payM==x[0]?"on":""}" onclick="setPM('${x[0]}')">${x[1]}</button>`).join("")}</div>
${payM=="CASH"?`<div class="cash"><input id="cash" inputmode="numeric" placeholder="Uang diterima" oninput="this.dataset.exact='';$('#kb').textContent=rp(Math.max(0,(+this.value||0)-tot()))"><div class="qrow"><button class="qk" onclick="setCash()">Uang pas</button>${[20000,50000,100000].map(v=>`<button class="qk" onclick="setCash(${v})">${v/1000}rb</button>`).join("")}</div><div class="kbr"><span>Kembalian</span><b id="kb">Rp0</b></div></div>`:payM=="SPLIT"?splitUI():payInfo()}<button class="pay" id="pb2" style="margin-top:14px" onclick="doPay()">Konfirmasi Bayar ${rp(tot())}</button>`}
function payOpen(){if(!cart.length)return alert("Keranjang kosong");if(!authed||!cur){toast("Login kasir dulu untuk menyelesaikan pembayaran");loginM("kasir");return}
if(!shopOpen(br))return alert("Toko belum dibuka. Tekan tombol Buka toko di bagian atas layar.");modal(payHtml())}
const payBack=()=>cart.length?modal(payHtml()):closeM();
function setPM(m){payM=m;modal(payHtml())}
function dec(id,sz){for(let i=cart.length-1;i>=0;i--)if(cart[i].pid==id&&(!sz||cart[i].sz==sz)){qty(i,-1);return}}
function clr(){if(cart.length&&confirm("Kosongkan semua pesanan?")){cart=[];vcode="";refC()}}
function addC(id,sz="R"){const l=cart.find(x=>x.pid==id&&x.sz==sz&&!x.ad.length);l?l.qty++:cart.push({pid:id,qty:1,sz,ad:[]});refC()}
function qty(i,d){cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);refC()}
function tg(i,o){const a=cart[i].ad;a.includes(o)?a.splice(a.indexOf(o),1):a.push(o);refC()}
function setCash(n){const c=$("#cash"),t=tot();c.dataset.exact=n==null?"1":"";c.value=n==null?t:n;$("#kb").textContent=rp(Math.max(0,+c.value-t))}
function refC(){const gd=$("#grid");if(gd)gd.innerHTML=grid();$("#cl").innerHTML=lines();$("#tt").textContent=rp(tot());$("#dsc").innerHTML=dscH();const c=$("#cash");if(c){if(c.dataset.exact)c.value=tot();$("#kb").textContent=rp(Math.max(0,(+c.value||0)-tot()))}
const n=cart.reduce((a,l)=>a+l.qty,0);$("#mn").textContent=n;$("#mt").textContent=rp(tot());$("#cn").textContent=n+" item";$("#pb").textContent="Pembayaran · "+rp(tot());if($("#sp2"))spUp();if($("#qn"))$("#qn").textContent=rp(payM=="SPLIT"?spAmt():tot());$(".mbar").classList.toggle("empty",!n)}
function doPay(){
if(!cart.length)return alert("Keranjang kosong");
if(!authed||!cur){toast("Login kasir dulu untuk menyelesaikan pembayaran");loginM("kasir");return}
if(!shopOpen(br))return alert("Toko belum dibuka. Tekan tombol Buka toko di bagian atas layar.");
if(brLock(cur)&&cur.br!=br)return alert("Akun ini tidak diizinkan checkout di cabang ini");
if(payM=="SPLIT")spV=+V("sp2")||0;
const sb=sub(),bp=best(sb),total=sb-bp.d,ce=$("#cash"),sp=payM=="SPLIT",spn=sp?spAmt():0,due=total-spn,cash=sp?(+V("sp1")||0):payM=="CASH"?(ce&&ce.dataset.exact?total:+V("cash")||0):total;
if(sp&&(spn<=0||spn>=total))return alert("Isi nominal "+(spM=="QRIS"?"QRIS":"transfer")+" lebih dari 0 dan kurang dari total. Untuk bayar penuh non-tunai, pakai tombol "+(spM=="QRIS"?"QRIS":"Transfer")+" biasa.");
if(cash<(sp?due:total))return alert(sp?"Uang tunai diterima kurang (sisa tunai "+rp(due)+")":"Uang diterima kurang");
const use={};cart.forEach(l=>lrec(l).forEach(r=>use[r.i]=(use[r.i]||0)+r.q*l.qty));

function mergeInto(sv,lc){let ns=0,ne=0,nb=0,nv=0;sv.seq=sv.seq||{};sv.stock=sv.stock||{};sv.sales=sv.sales||[];sv.exp=sv.exp||[];sv.buys=sv.buys||[];sv.mv=sv.mv||[];
if(!confirm("Data di server sudah berubah, dan perangkat ini punya data baru yang belum terkirim.\n\nGabungkan? Transaksi, pengeluaran, dan pembelian perangkat ini akan ditambahkan ke data server. Perubahan lain di perangkat ini (mis. edit produk atau pengaturan) akan diganti data server."))throw new Error("Dibatalkan");
const use=(x,g)=>x.items.forEach(i=>(i.u||((lc.products.find(p=>p.id==i.pid)||{}).recipe||[]).map(r=>({i:r.i,q:r.q}))).forEach(r=>{const k=x.br+"|"+r.i;sv.stock[k]=(sv.stock[k]||0)+g*r.q*i.qty}));
const tb=new Set([...(sv.tomb||[]),...(lc.tomb||[])]);sv.tomb=[...tb];sv.sales=sv.sales.filter(x=>!tb.has(x.id));sv.exp=sv.exp.filter(x=>!tb.has(x.id));
Object.keys(lc.seq||{}).forEach(k=>sv.seq[k]=Math.max(sv.seq[k]||0,lc.seq[k]));
const sid=new Map(sv.sales.map(x=>[x.id,x])),nos=new Set(sv.sales.map(x=>x.no));
(lc.sales||[]).forEach(x=>{const o=sid.get(x.id);
if(!o){if(tb.has(x.id))return;if(nos.has(x.no)){const d=bd(x).replaceAll("-",""),k=x.br+d;sv.seq[k]=(sv.seq[k]||0)+1;x.no=`ZC-${x.br.toUpperCase()}-${d}-${String(sv.seq[k]).padStart(4,"0")}`}
nos.add(x.no);if(x.st=="OK")use(x,-1);sv.sales.push(x);ns++}
else if(x.st=="VOID"&&o.st=="OK"){o.st="VOID";o.voidAt=x.voidAt;use(o,1);nv++}});
const eid=new Map(sv.exp.map(e=>[e.id,e]));(lc.exp||[]).forEach(e=>{const o=eid.get(e.id);if(!o){if(tb.has(e.id))return;sv.exp.push(e);ne++}else if(e.st=="VOID"&&o.st=="OK"){o.st="VOID";nv++}});
const bk=b=>[b.at,b.br,b.i,b.n,b.t].join("|"),bs=new Set(sv.buys.map(bk));(lc.buys||[]).forEach(b=>{if(!bs.has(bk(b))){sv.buys.push(b);const k=b.br+"|"+b.i;sv.stock[k]=(sv.stock[k]||0)+b.n;nb++}});
const mk=m=>[m.at,m.br,m.i,m.d,m.why].join("|"),ms=new Set(sv.mv.map(mk));(lc.mv||[]).forEach(m=>{if(!ms.has(mk(m))&&/^(Penjualan|Pembatalan|Penerimaan)/.test(m.why))sv.mv.push(m)});
sv.mv.sort((a,b)=>a.at<b.at?-1:a.at>b.at?1:0);
return`${ns} transaksi, ${ne} pengeluaran, ${nb} pembelian, ${nv} pembatalan`}

if(!window.cloudSync)return toast("Sinkronisasi belum aktif (Firebase belum termuat). Periksa koneksi internet.");

b.dataset.busy="1";b.classList.add("spin");b.classList.remove("ok");$("#ftl").textContent="Memperbarui…";

toast(r.k=="same"?"Data sudah terbaru ✓":r.k=="sent"?"Data perangkat ini terkirim ke server ✓":r.k=="pulled"?"Data terbaru dari server diterima ✓":"Data digabung & dikirim ✓ ("+r.msg+")");
b.classList.add("ok");setTimeout(()=>b.classList.remove("ok"),1800);render()}

const asc=s=>String(s??"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[\u00a0\u2007\u202f]/g," ").replace(/[‐-―]/g,"-").replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[·•]/g,"*").replace(/→/g,">").replace(/…/g,"...").replace(/[^\x20-\x7e\n]/g,"");
function wrapT(s,w){const out=[];w=Math.max(4,w);for(const para of asc(s).split("\n")){let line="";for(let word of para.trim().split(/\s+/)){while(word.length>w){if(line){out.push(line);line=""}out.push(word.slice(0,w));word=word.slice(w)}if(!line)line=word;else if(line.length+1+word.length<=w)line+=" "+word;else{out.push(line);line=word}}out.push(line)}return out}
function LBD(cpl){const L=[],o={L,
t(s,x={}){const z=x.z||1,i=x.i||0,w=Math.floor(cpl/z)-i;wrapT(s,w).forEach(q=>L.push({a:x.a||"l",s:" ".repeat(i)+q,b:x.b,z}));return o},
c(s,x={}){return o.t(s,{...x,a:"c"})},
lr(l,r,x={}){const z=x.z||1,w=Math.floor(cpl/z);r=asc(r);const ls=wrapT(l,w),la=ls.pop()||"";ls.forEach(q=>L.push({a:"l",s:q,b:x.b,z}));if(la.length+1+r.length<=w)L.push({a:"l",s:la+" ".repeat(w-la.length-r.length)+r,b:x.b,z});else{L.push({a:"l",s:la,b:x.b,z});L.push({a:"r",s:r,b:x.b,z})}return o},
hr(){L.push({a:"l",s:"-".repeat(cpl)});return o},
sp(){L.push({a:"l",s:""});return o},
logo(){L.push({k:"logo"});return o}};return o}

const ENCT=new TextEncoder();
function ESC(){const a=[],o={
raw(...b){b.forEach(x=>a.push(x));return o},
bytes(b){for(let i=0;i<b.length;i++)a.push(b[i]);return o},
init(){return o.raw(0x1b,0x40)},
al(n){return o.raw(0x1b,0x61,n)},
b(on){return o.raw(0x1b,0x45,on?1:0)},
sz(w,h){return o.raw(0x1d,0x21,((w-1)<<4)|(h-1))},
tx(s){return o.bytes(ENCT.encode(asc(s)))},
ln(s=""){return o.tx(s).raw(0x0a)},
feed(n){return o.raw(0x1b,0x64,Math.min(255,n))},
cut(){return o.raw(0x1d,0x56,0x42,0x00)},
drawer(){return o.raw(0x1b,0x70,0x00,0x19,0xfa)},
out(){return new Uint8Array(a)}};return o}
const LOGOC={};
async function logoBits(w){w=Math.floor(w/8)*8;if(LOGOC[w])return LOGOC[w];const img=new Image();img.src=LOGO;await img.decode();const h=Math.max(8,Math.round(img.naturalHeight*w/img.naturalWidth)),cv=document.createElement("canvas");cv.width=w;cv.height=h;const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);const d=x.getImageData(0,0,w,h).data,bw=w/8,out=new Uint8Array(bw*h);
for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){const i=(y*w+xx)*4;if(.299*d[i]+.587*d[i+1]+.114*d[i+2]<150)out[y*bw+(xx>>3)]|=0x80>>(xx&7)}
return LOGOC[w]={bw,h,out}}
async function linesBytes(L){const e=ESC().init();
for(const x of L){
if(x.k=="logo"){try{const g=await logoBits(+PCFG.logoW||240);e.al(1);for(let y=0;y<g.h;y+=96){const n=Math.min(96,g.h-y);e.raw(0x1d,0x76,0x30,0,g.bw&255,g.bw>>8,n&255,n>>8).bytes(g.out.subarray(y*g.bw,(y+n)*g.bw))}e.al(0)}catch(err){console.error("logo",err)}continue}
e.al(x.a=="c"?1:x.a=="r"?2:0).b(x.b).sz(x.z||1,x.z||1).ln(x.s)}
return e.sz(1,1).b(0).al(0)}
async function pBuild(L,drawer){const e=await linesBytes(L),fin=ESC().feed(Math.max(0,+PCFG.feed||0));if(PCFG.cut)fin.cut();const body=concatU(e.out(),fin.out()),n=Math.min(5,Math.max(1,+PCFG.copies||1)),parts=[];if(drawer)parts.push(ESC().drawer().out());for(let i=0;i<n;i++)parts.push(body);return concatU(...parts)}

async function bleOpen(d){const g=await d.gatt.connect(),sv=await g.getPrimaryServices();let ch=null;
for(const s of sv){let cs=[];try{cs=await s.getCharacteristics()}catch{}for(const c of cs)if(c.properties.writeWithoutResponse||c.properties.write){ch=c;break}if(ch)break}
if(!ch){try{d.gatt.disconnect()}catch{}throw new Error("Printer ini tidak punya jalur tulis BLE (kemungkinan Bluetooth Classic). Gunakan mode RawBT atau Serial.")}
PST.dev=d;PST.ch=ch;PST.t="ble";PST.name=d.name||"Printer BLE";
if(!d._zl){d._zl=1;d.addEventListener("gattserverdisconnected",()=>{pMsg("Bluetooth terputus. Tekan Hubungkan atau Cetak untuk menyambung lagi.",1)})}}
async function usbOpen(d){await d.open();if(!d.configuration)await d.selectConfiguration(1);let pick=null;
for(const i of d.configuration.interfaces)for(const a of i.alternates){const o=a.endpoints.find(e=>e.direction=="out");if(o&&(!pick||(a.interfaceClass==7&&!pick.c7)))pick={n:i.interfaceNumber,alt:a.alternateSetting,ep:o.endpointNumber,c7:a.interfaceClass==7}}
if(!pick){try{await d.close()}catch{}throw new Error("Jalur cetak USB tidak ditemukan pada perangkat ini.")}
await d.claimInterface(pick.n);if(pick.alt)await d.selectAlternateInterface(pick.n,pick.alt);
PST.dev=d;PST.ep=pick.ep;PST.n=pick.n;PST.t="usb";PST.name=d.productName||"Printer USB"}
async function serOpen(p){await p.open({baudRate:+PCFG.baud||9600});PST.port=p;PST.w=p.writable.getWriter();PST.t="serial";const i=p.getInfo?p.getInfo():{};PST.name="Serial"+(i.usbVendorId?" ("+i.usbVendorId.toString(16)+":"+(i.usbProductId||0).toString(16)+")":" port")}
async function pClose(q){try{if(PST.t=="ble"&&PST.dev&&PST.dev.gatt.connected)PST.dev.gatt.disconnect();
if(PST.t=="usb"&&PST.dev){try{await PST.dev.releaseInterface(PST.n)}catch{}await PST.dev.close()}
if(PST.t=="serial"&&PST.port){try{PST.w.releaseLock()}catch{}await PST.port.close()}}catch(e){console.error(e)}
PST.t="";PST.dev=PST.ch=PST.port=PST.w=null;if(q)prnRefresh();else pMsg("Printer diputus.")}
async function pConnect(){const m=PCFG.mode;
if(m=="browser")return pMsg("Mode dialog cetak tidak perlu koneksi. Tekan Tes printer lalu pilih printer di dialog.");
if(m=="rawbt")return pMsg("RawBT tidak perlu dihubungkan dari sini. Pasangkan printer di aplikasi RawBT, lalu tekan Tes printer.");
if(!pSup[m]())return pMsg("Browser ini tidak mendukung "+MODEN[m]+". Gunakan Chrome/Edge terbaru atau pilih jenis printer lain.",1);
if(!window.isSecureContext)return pMsg("Koneksi perangkat butuh halaman HTTPS (atau localhost).",1);
PST.busy=true;prnRefresh();
try{if(PST.t)await pClose(true);
if(m=="ble"){const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BLE_SV});PST.msg="Menyambung ke "+(d.name||"perangkat")+"…";prnRefresh();await bleOpen(d)}
else if(m=="usb"){await usbOpen(await navigator.usb.requestDevice({filters:USB_F}))}
else if(m=="serial"){await serOpen(await navigator.serial.requestPort())}
PCFG.name=PST.name;pSave();PST.busy=false;pMsg("Terhubung ke "+PST.name+". Tekan Tes printer untuk mencoba.")}
catch(e){const cancel=/cancel|chosen|No device selected/i.test((e.name||"")+" "+(e.message||""));PST.busy=false;pMsg(cancel?"Pemilihan perangkat dibatalkan.":"Gagal menghubungkan: "+(e.message||e),!cancel)}
finally{PST.busy=false;prnRefresh()}}
async function pWrite(u){const t=PST.t;
if(t=="ble"){if(!PST.dev.gatt.connected)await bleOpen(PST.dev);const c=PST.ch,n=Math.max(20,+PCFG.chunk||100),nr=c.properties.writeWithoutResponse;for(let i=0;i<u.length;i+=n){const p=u.slice(i,i+n);if(nr)await c.writeValueWithoutResponse(p);else if(c.writeValueWithResponse)await c.writeValueWithResponse(p);else await c.writeValue(p);if(+PCFG.delay)await sleep(+PCFG.delay)}}
else if(t=="usb"){for(let i=0;i<u.length;i+=4096){const r=await PST.dev.transferOut(PST.ep,u.slice(i,i+4096));if(r.status!="ok")throw new Error("USB: "+r.status)}}
else if(t=="serial"){await PST.w.write(u)}
else throw new Error("Printer belum terhubung")}

PST.busy=true;prnRefresh();
try{const u=await build();await pSend(u);PST.busy=false;pMsg(PCFG.mode=="rawbt"?"Dikirim ke RawBT ("+u.length+" byte). Jika tidak ada yang terbuka, pastikan RawBT terpasang.":(okMsg||"Terkirim ke printer")+" ("+u.length+" byte).")}
catch(e){PST.busy=false;pMsg("Gagal mencetak: "+(e.message||e),1)}

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAnalytics,isSupported}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
import{getFirestore,collection,doc,onSnapshot,writeBatch,getDocsFromServer}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBOjKUzM39tYdHfBVnZ8aNN6n5I4nAQ8P8",authDomain:"zona-c04ee.firebaseapp.com",projectId:"zona-c04ee",storageBucket:"zona-c04ee.firebasestorage.app",messagingSenderId:"862629272585",appId:"1:862629272585:web:1c82c88eadf732a3de2cd8",measurementId:"G-REQRPPQ03Q"};
const app=initializeApp(firebaseConfig);
isSupported().then(ok=>{if(ok)getAnalytics(app)}).catch(()=>{});
const db=getFirestore(app),col=collection(db,"zona_mgmt"),CID=uid(),CH=300000;
let ready=false,timer=null,lastJson="",nOld=0,retry=null;
const bd=document.createElement("div");bd.className="np";
bd.style.cssText="position:fixed;top:6px;right:8px;z-index:30;font:11px system-ui;padding:3px 9px;border-radius:99px;background:#fff;color:#0b3a75;box-shadow:0 1px 6px rgba(11,58,117,.25);pointer-events:none";
document.body.appendChild(bd);
const st=(t,bad)=>{bd.textContent=t;bd.style.color=bad?"#b42318":"#0b3a75"};
st("☁ Menyambung…");
const busy=()=>$("#modal").classList.contains("on")||/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||"");
function safeRender(){clearTimeout(retry);if(busy())retry=setTimeout(safeRender,1500);else render()}
async function push(){
  const json=JSON.stringify(S);if(json===lastJson){window.dirtyL=false;st("☁ Tersinkron");return}
  const parts=[];for(let i=0;i<json.length;i+=CH)parts.push(json.slice(i,i+CH));
  const v=Date.now(),b=writeBatch(db);
  parts.forEach((d,i)=>b.set(doc(col,"c"+String(i).padStart(4,"0")),{i,n:parts.length,v,by:CID,d}));
  for(let i=parts.length;i<nOld;i++)b.delete(doc(col,"c"+String(i).padStart(4,"0")));
  lastJson=json;nOld=parts.length;window.dirtyL=false;st("☁ Menyimpan…");
  try{await b.commit();st("☁ Tersinkron")}catch(e){console.error(e);lastJson="";window.dirtyL=true;st("☁ Gagal simpan",1)}
}
window.cloudPush=()=>{if(!ready)return;clearTimeout(timer);timer=setTimeout(push,700)};
function adopt(o,json,n){lastJson=json;nOld=n;S=o;S.promos=S.promos||[];S.users=S.users||[];fixS();localStorage.setItem(KEY,JSON.stringify(S));
  if(!S.branches.some(x=>x.id==br))br=S.branches[0].id;
  if(authed){cur=S.users.find(u=>u.id==cur.id)||null;if(!cur){lock();return}if(brLock(cur))br=cur.br}}
window.cloudSync=async(mergeFn)=>{
  if(!ready)throw new Error("Belum tersambung ke server");
  const snap=await getDocsFromServer(col),ds=snap.docs.map(x=>x.data()).sort((a,b)=>a.i-b.i);
  if(ds.length&&(ds.length!==ds[0].n||ds.some(x=>x.v!==ds[0].v)))throw new Error("Server sedang menyimpan dari perangkat lain, coba lagi sebentar");
  const sj=ds.map(x=>x.d).join(""),dirty=!!window.dirtyL;clearTimeout(timer);
  if(!sj||sj===lastJson){if(dirty){await push();return{k:"sent"}}return{k:"same"}}
  if(!dirty){adopt(JSON.parse(sj),sj,ds.length);return{k:"pulled"}}
  const sv=JSON.parse(sj),msg=mergeFn(sv,S);adopt(sv,sj,ds.length);await push();return{k:"merged",msg}};
onSnapshot(col,snap=>{
  if(snap.metadata.hasPendingWrites)return;
  const ds=snap.docs.map(x=>x.data()).sort((a,b)=>a.i-b.i);
  if(!ds.length){if(!ready){ready=true;push()}return}
  if(ds.length!==ds[0].n||ds.some(x=>x.v!==ds[0].v))return;
  nOld=ds.length;
  if(ready&&ds[0].by===CID){st("☁ Tersinkron");return}
  const json=ds.map(x=>x.d).join("");
  if(json===lastJson){ready=true;st("☁ Tersinkron");return}
  try{
    const d=JSON.parse(json),loc=localStorage.getItem(KEY);
    if(!ready&&loc&&loc!==json&&!localStorage.getItem(KEY+"_localbackup"))localStorage.setItem(KEY+"_localbackup",loc);
    lastJson=json;S=d;S.promos=S.promos||[];S.users=S.users||[];fixS();localStorage.setItem(KEY,json);
    if(!S.branches.some(x=>x.id==br))br=S.branches[0].id;
    if(authed){cur=S.users.find(u=>u.id==cur.id)||null;if(!cur){lock();ready=true;st("☁ Tersinkron");return}if(brLock(cur))br=cur.br}
    ready=true;st("☁ Tersinkron");safeRender();
  }catch(e){console.error(e);st("☁ Data cloud rusak",1)}
},e=>{console.error(e);st(e.code=="permission-denied"?"☁ Izin ditolak (cek Rules)":"☁ Offline",1)});
addEventListener("online",()=>st("☁ Menyambung…"));
</script>
