<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b3a75"><title>ZONA - Tentukan Zona Mu</title>
<style>
:root{--d:#0b3a75;--m:#1d5fb4;--c:#eef5ff;--s:#d3e3fa;--a:#2f80ed}
*{box-sizing:border-box;margin:0}
body{font:15px system-ui,sans-serif;background:var(--c);color:var(--d)}
#app{min-height:100vh}
aside#nav{position:fixed;top:0;left:0;bottom:0;width:240px;max-width:85vw;z-index:20;overflow:auto;background:var(--d);color:var(--c);padding:14px;transform:translateX(-100%);transition:transform .2s}body.navopen aside#nav{transform:none;box-shadow:4px 0 18px rgba(0,0,0,.25)}#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:19}body.navopen #ov{display:block}.x{float:right;cursor:pointer;padding:2px 8px;font-size:1.2rem}.hb{font-size:1.2rem;min-height:42px}.top select{flex:1;min-width:130px;max-width:260px}main{transition:margin .2s}@media(min-width:801px){body.navopen main{margin-left:240px}body.navopen #ov{display:none}body.navopen .top .brand{display:none}body.navopen aside#nav{box-shadow:none}}
#nav b{letter-spacing:.12em;display:block;margin-bottom:12px}
#nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit}
#nav button.on,#nav button:hover{background:var(--a);color:#fff}
main{flex:1;padding:16px;min-width:0}
.top{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
input,select{font:inherit;padding:8px;border:1px solid var(--s);border-radius:8px;background:#fff;color:var(--d);max-width:100%}
.btn{background:var(--d);color:var(--c);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600}
.btn:hover,.btn.s:hover{background:var(--a);color:#fff}.btn.s{background:var(--s);color:var(--d)}.btn.r{background:#08284f;color:#fff}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 8px rgba(11,58,117,.12)}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));margin-bottom:14px}
.pos{display:grid;gap:14px;grid-template-columns:1fr 340px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;margin-bottom:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--s)}
.tw{overflow-x:auto}.item{cursor:pointer}.item:hover{outline:2px solid var(--a)}
.big{font-size:1.4rem;font-weight:800}.warn{color:var(--m);font-weight:700}.mut{opacity:.65;font-size:.85rem}
.fm{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:40;padding:12px}
#modal.on{display:grid}
#mb{background:#fff;border-radius:12px;padding:18px;max-width:420px;width:100%;max-height:92vh;overflow:auto}
.rc{font:12px monospace;margin:0 auto}.rc.w58{width:58mm}.rc.w80{width:80mm}.rc.a4{width:100%}
.rc hr{border:0;border-top:1px dashed #000;margin:6px 0}.rc div{display:flex;justify-content:space-between;gap:8px}
@media(max-width:800px){.pos{grid-template-columns:1fr}}
@media print{#app,.np,#ov{display:none!important}#modal{position:static;background:none;display:block}#mb{padding:0;max-width:none}}
.mbar,.mclose{display:none}
@media(max-width:800px){main{padding:10px 10px 84px}.g{grid-template-columns:repeat(2,1fr)}input,select{font-size:16px}.btn{min-height:42px}
.cartp{position:fixed;left:0;right:0;bottom:0;z-index:5;border-radius:16px 16px 0 0;max-height:88vh;overflow:auto;transform:translateY(110%);transition:transform .2s;align-self:auto!important}
.cartp.open{transform:none}.mclose{display:inline-block;float:right}
.mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--d);color:var(--c);padding:12px 16px;justify-content:space-between;align-items:center;font-weight:700}}
.brand{display:flex;align-items:center;gap:10px}.lg{height:46px;width:auto;background:#fff;border-radius:10px;padding:3px}.brand small{display:block;font-size:.72rem;opacity:.8}
#nav .brand b,.brand b{display:block;width:auto;margin:0;font-size:1.15rem;letter-spacing:.15em}
</style></head><body>
<div id="app"><aside id="nav"></aside><main id="main"></main></div>
<div id="modal"><div id="mb"></div></div>
<div id="ov" onclick="tnav()"></div>

async function hash(p,salt){if(crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}let h=5381;for(const c of salt+p)h=(h*33^c.charCodeAt(0))>>>0;return"f"+h}

S.sales.push(s);cart=[];vcode="";save();render();receipt(s.id)}

<div class="card"><b>Data & backup</b><p class="mut">Semua data tersimpan di browser ini saja (localStorage). Login hanya pembatas tampilan, bukan keamanan sungguhan (data tetap bisa dibaca lewat alat browser). Tidak sinkron antar perangkat. Jika lupa kata sandi, satu-satunya jalan adalah menghapus data situs di browser (data ikut hilang), jadi ekspor backup secara berkala.</p><div class="fm" style="margin-top:8px"><button class="btn" onclick="bak()">Ekspor backup JSON</button><input type="file" id="imp" accept=".json" onchange="impF(this)"><button class="btn r" onclick="rst()">Reset semua data</button></div></div>`}
function badd(){const n=V("b1").trim();if(!n)return alert("Nama wajib");S.branches.push({id:"c"+uid(),name:n,addr:V("b2")});save();render()}
function bedit(id){const b=S.branches.find(x=>x.id==id),n=prompt("Nama cabang",b.name);if(n){b.name=n;b.addr=prompt("Alamat",b.addr||"")??b.addr;save();render()}}
function bak(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="zona-backup-"+jk()+".json";a.click()}
function impF(el){const f=el.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.products||!d.branches)throw 0;if(confirm("Timpa semua data saat ini dengan backup?")){d.users=S.users;S=d;S.promos=S.promos||[];save();br=S.branches[0].id;render()}}catch{alert("File backup tidak valid")}})}
function rst(){if(confirm("Hapus SEMUA data?")&&confirm("Yakin? Tindakan ini tidak bisa dibatalkan.")){{const u=S.users,pr=0;S=seed();S.users=u;S.promos=[]}save();br=S.branches[0].id;cart=[];render()}}

S.branches.forEach(b=>{b.name=b.name.replace(/ZONA Coffee/i,"ZONA")});save();if(document.head){const l=document.createElement("link");l.rel="icon";l.href=LOGO;document.head.appendChild(l)}
const id=sessionStorage.getItem("zona_uid");cur=S.users.find(u=>u.id==id)||null;authed=!!cur;if(cur&&innerWidth>800)document.body.classList.add("navopen");if(cur&&cur.role=="kepala")br=cur.br;
render();if(location.hash=="#admin"&&!authed)loginM("riwayat")}
init();
